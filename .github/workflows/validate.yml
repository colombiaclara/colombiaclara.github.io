name: Validate untrusted changes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Web
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: colombia-clara-web

      - name: Checkout Spec at locked commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/colombia-clara-spec
          ref: 7d6f5aa3984d26f640b588b60104acbb218464ab
          persist-credentials: false
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          path: colombia-clara-spec

      - name: Checkout Knowledge at locked commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/colombia-clara-knowledge
          ref: 22b20be3ff5758d3d033612362c1c474c30d9f7f
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          persist-credentials: false
          path: colombia-clara-knowledge

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: colombia-clara-web/package-lock.json

      - name: Install and validate
        working-directory: colombia-clara-web
        env:
          SPEC_PATH: ../colombia-clara-spec
          KNOWLEDGE_PATH: ../colombia-clara-knowledge
          PUBLIC_BASE_URL: https://example.invalid/colombia-clara
          SOURCE_DATE_EPOCH: 1788316800
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Dependency audit
        working-directory: colombia-clara-web
        run: npm audit --audit-level=high
