name: Trusted GitHub Pages deployment

on:
  workflow_dispatch:
    inputs:
      public_base_url:
        description: Approved absolute Pages URL
        required: true
        type: string
      spec_commit:
        description: Exact compatible Spec commit
        required: true
        type: string
      knowledge_commit:
        description: Exact merged Knowledge commit to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Web
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: colombia-clara-web

      - name: Checkout Spec at locked commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/colombia-clara-spec
          ref: ${{ inputs.spec_commit }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          persist-credentials: false
          path: colombia-clara-spec

      - name: Checkout Knowledge at locked commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/colombia-clara-knowledge
          ref: ${{ inputs.knowledge_commit }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          persist-credentials: false
          path: colombia-clara-knowledge

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: colombia-clara-web/package-lock.json

      - name: Rebuild trusted output
        working-directory: colombia-clara-web
        env:
          NODE_ENV: production
          BUILD_MODE: production
          PREVIEW_UNPUBLISHED: "false"
          SPEC_PATH: ../colombia-clara-spec
          KNOWLEDGE_PATH: ../colombia-clara-knowledge
          SPEC_COMMIT: ${{ inputs.spec_commit }}
          KNOWLEDGE_COMMIT: ${{ inputs.knowledge_commit }}
          WEB_COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
          PUBLIC_BASE_URL: ${{ inputs.public_base_url }}
        run: |
          test "$PREVIEW_UNPUBLISHED" != "true"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$WEB_COMMIT")"
          npm ci --ignore-scripts
          npm run check

      - name: Publish generated branch
        working-directory: colombia-clara-web
        env:
          WEB_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin gh-pages || true
          remote_sha="$(git rev-parse --verify refs/remotes/origin/gh-pages 2>/dev/null || true)"
          git worktree add --detach .tmp/gh-pages
          git -C .tmp/gh-pages switch --orphan generated-pages
          git -C .tmp/gh-pages rm -rf .
          cp -a dist/. .tmp/gh-pages/
          git -C .tmp/gh-pages add -A
          git -C .tmp/gh-pages -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Deploy ${WEB_COMMIT}"
          git -C .tmp/gh-pages push --force-with-lease=refs/heads/gh-pages:${remote_sha} origin HEAD:gh-pages

      - name: Verify deployment and emit evidence
        working-directory: colombia-clara-web
        env:
          PUBLIC_BASE_URL: ${{ inputs.public_base_url }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WEB_COMMIT: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --show-error "$PUBLIC_BASE_URL/build-info.json" -o /tmp/build-info.json && break
            sleep 10
          done
          curl --fail --silent --show-error "$PUBLIC_BASE_URL/build-manifest.json" -o /tmp/build-manifest.json
          test "$(jq -r .webCommit /tmp/build-info.json)" = "$WEB_COMMIT"
          test "$(jq -r .rootDigest /tmp/build-manifest.json)" = "$(jq -r .rootDigest dist/build-manifest.json)"
          jq -n \
            --arg run "$WORKFLOW_RUN_ID" --arg attempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg spec "$(jq -r .specCommit dist/build-info.json)" \
            --arg knowledge "$(jq -r .knowledgeCommit dist/build-info.json)" \
            --arg web "$WEB_COMMIT" --arg digest "$(jq -r .rootDigest dist/build-manifest.json)" \
            --arg base "$PUBLIC_BASE_URL" --arg deployed "$(date -u +%FT%TZ)" \
            --argjson articles "$(jq '[.publishedArticles[] | {articleId:.id,url:.url}]' dist/build-info.json)" \
            --argjson checked "$(jq -n --arg base "$PUBLIC_BASE_URL" '[($base+"/build-info.json"),($base+"/build-manifest.json")]')" \
            '{schemaVersion:"1.0.0",status:"VERIFIED",workflowRunId:$run,workflowRunAttempt:($attempt|tonumber),specCommit:$spec,knowledgeCommit:$knowledge,webCommit:$web,buildManifest:{algorithm:"CC-BUILD-SHA256-V1",rootDigest:$digest},publicBaseUrl:$base,publishedArticles:$articles,deployedAt:$deployed,httpVerification:{verified:true,statusCode:200,checkedUrls:$checked},artifactUrl:("https://github.com/${{ github.repository }}/actions/runs/"+$run)}' > deployment-evidence.json
          SPEC_PATH=../colombia-clara-spec node scripts/validate-deployment-evidence.mjs deployment-evidence.json

      - name: Preserve deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: colombia-clara-web/deployment-evidence.json
          if-no-files-found: error
          retention-days: 90
